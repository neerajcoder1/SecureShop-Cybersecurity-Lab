<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - Authentication</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <span class="logo-icon">[]</span> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <div class="container" style="max-width: 800px;">
        <div class="grid grid-cols-2 gap-2 mt-2">
            
            <!-- Login Form -->
            <div class="card">
                <h3><span class="logo-icon">></span> Authenticate</h3>
                <p class="text-muted" style="font-size: 0.9rem;">Test authentication bypass and JWT mechanisms.</p>
                
                <div id="login-error" class="error"></div>
                
                <form id="login-form" class="mt-1">
                    <div class="form-group">
                        <label>Username / Payload</label>
                        <input type="text" id="login-username" class="terminal" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" class="terminal" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Credentials</button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="card">
                <h3><span class="logo-icon">></span> Provision Account</h3>
                <p class="text-muted" style="font-size: 0.9rem;">Create a test identity for authorization testing.</p>
                
                <div id="register-msg"></div>
                
                <form id="register-form" class="mt-1">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" class="terminal" required pattern="^[a-zA-Z0-9_]+$" title="Alphanumeric and underscores only">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" class="terminal" required>
                    </div>
                    <div class="form-group">
                        <label>Password (min 8 chars)</label>
                        <input type="password" id="reg-password" class="terminal" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-outline" style="width: 100%;">Register Identity</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = '';
            
            const payload = {
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    setToken(data.access_token);
                    window.location.href = '/dashboard.html';
                } else {
                    const data = await res.json();
                    errDiv.textContent = data.detail || 'Login failed';
                }
            } catch (err) {
                errDiv.textContent = 'Network error during authentication test.';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('register-msg');
            msgDiv.textContent = '';
            msgDiv.className = '';
            
            const payload = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    msgDiv.textContent = 'Account provisioned successfully. You can now authenticate.';
                    msgDiv.className = 'success mt-1';
                    document.getElementById('register-form').reset();
                } else {
                    const data = await res.json();
                    msgDiv.textContent = data.detail || 'Registration rejected by backend controls.';
                    msgDiv.className = 'error mt-1';
                }
            } catch (err) {
                msgDiv.textContent = 'Network error during registration test.';
                msgDiv.className = 'error mt-1';
            }
        });
    </script>
</body>
</html>
