<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - Login/Register</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <header>
        <h1>SecureShop Lab</h1>
        <nav id="main-nav"></nav>
    </header>

    <div class="container" style="display: flex; gap: 2rem;">
        
        <!-- Login Form -->
        <div style="flex: 1;">
            <h2>Login</h2>
            <div id="login-error" class="error"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Register Form -->
        <div style="flex: 1;">
            <h2>Register</h2>
            <div id="register-msg"></div>
            <form id="register-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" required pattern="^[a-zA-Z0-9_]+$" title="Alphanumeric and underscores only">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Password (min 8 chars)</label>
                    <input type="password" id="reg-password" required minlength="8">
                </div>
                <button type="submit">Register</button>
            </form>
        </div>

    </div>

    <script src="/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = '';
            
            const payload = {
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    setToken(data.access_token);
                    window.location.href = '/index.html';
                } else {
                    const data = await res.json();
                    errDiv.textContent = data.detail || 'Login failed';
                }
            } catch (err) {
                errDiv.textContent = 'Network error';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('register-msg');
            msgDiv.textContent = '';
            msgDiv.className = '';
            
            const payload = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    msgDiv.textContent = 'Registration successful! You can now login.';
                    msgDiv.className = 'success';
                    document.getElementById('register-form').reset();
                } else {
                    const data = await res.json();
                    msgDiv.textContent = data.detail || 'Registration failed';
                    msgDiv.className = 'error';
                }
            } catch (err) {
                msgDiv.textContent = 'Network error';
                msgDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
