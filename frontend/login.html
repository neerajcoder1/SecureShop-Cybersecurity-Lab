<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - Authentication</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" style="margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="8 10 11 13 8 16"></polyline><line x1="13" y1="16" x2="16" y2="16"></line></svg> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <style>
        .auth-container {
            max-width: 900px;
            margin: 5rem auto;
            align-items: stretch;
        }
        .auth-card {
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        [data-theme="light"] .auth-card {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.5s ease;
        }
        .auth-card.reg-card::before {
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }
        .auth-card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 166, 255, 0.4);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        [data-theme="light"] .auth-card:hover {
            box-shadow: 0 25px 50px rgba(0,0,0,0.12);
        }
        .auth-card.reg-card:hover {
            border-color: rgba(35, 134, 54, 0.4);
        }
        .auth-card:hover::before {
            transform: scaleX(1);
        }
        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2.5rem;
            color: var(--text-light);
        }
        .auth-icon {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: inset 0 0 10px rgba(88, 166, 255, 0.2);
        }
        .reg-icon {
            background: rgba(35, 134, 54, 0.15);
            color: var(--accent-green);
            box-shadow: inset 0 0 10px rgba(35, 134, 54, 0.2);
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.9rem 1rem 0.9rem 3.2rem;
            border: 1px solid var(--border-subtle);
            background: rgba(13, 17, 23, 0.7);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }
        [data-theme="light"] .input-group input {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }
        .input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2), inset 2px 2px 5px rgba(0,0,0,0.2);
            background: var(--bg-dark);
        }
        [data-theme="light"] .input-group input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2), inset 2px 2px 5px rgba(0,0,0,0.05);
        }
        .reg-card .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.2), inset 2px 2px 5px rgba(0,0,0,0.2);
        }
        [data-theme="light"] .reg-card .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.2), inset 2px 2px 5px rgba(0,0,0,0.05);
        }
        .input-group:focus-within svg {
            color: var(--accent-blue);
            transform: translateY(-50%) scale(1.15);
        }
        .reg-card .input-group:focus-within svg {
            color: var(--accent-green);
        }
        .auth-btn {
            padding: 0.9rem;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-auth-primary {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.25);
        }
        .btn-auth-primary:hover {
            background: var(--accent-blue-hover);
            box-shadow: 0 6px 20px rgba(88, 166, 255, 0.4);
            transform: translateY(-2px);
        }
        .btn-auth-success {
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.25);
        }
        .btn-auth-success:hover {
            background: var(--accent-green-hover);
            box-shadow: 0 6px 20px rgba(35, 134, 54, 0.4);
            transform: translateY(-2px);
        }
        form {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>

    <div class="container auth-container">
        <div class="grid grid-cols-2 gap-2">
            
            <!-- Login Form -->
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    </div>
                    <div>
                        <h2 style="margin:0; font-size:1.4rem;">Authenticate</h2>
                        <span class="text-muted" style="font-size: 0.85rem;">Test bypass & JWT mechanisms</span>
                    </div>
                </div>
                
                <div id="login-error" class="error"></div>
                
                <form id="login-form">
                    <div class="input-group">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="login-username" placeholder="Username / Payload" required>
                    </div>
                    <div class="input-group">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="auth-btn btn-auth-primary">Submit Credentials</button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="auth-card reg-card">
                <div class="auth-header">
                    <div class="auth-icon reg-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </div>
                    <div>
                        <h2 style="margin:0; font-size:1.4rem;">Provision Account</h2>
                        <span class="text-muted" style="font-size: 0.85rem;">Create a test identity for authorization</span>
                    </div>
                </div>
                
                <div id="register-msg"></div>
                
                <form id="register-form">
                    <div class="input-group">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="reg-username" placeholder="Username / Payload" required>
                    </div>
                    <div class="input-group">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="reg-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="reg-password" placeholder="Password (min 8 chars)" required minlength="8">
                    </div>
                    <button type="submit" class="auth-btn btn-auth-success">Register Identity</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = '';
            
            const payload = {
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    setToken(data.access_token);
                    window.location.href = '/dashboard.html';
                } else {
                    const data = await res.json();
                    errDiv.textContent = typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'Login failed');
                }
            } catch (err) {
                errDiv.textContent = 'Network error during authentication test.';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('register-msg');
            msgDiv.textContent = '';
            msgDiv.className = '';
            
            const payload = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    msgDiv.textContent = 'Account provisioned successfully. You can now authenticate.';
                    msgDiv.className = 'success mt-1';
                    document.getElementById('register-form').reset();
                } else {
                    const data = await res.json();
                    msgDiv.textContent = typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'Registration rejected by backend controls.');
                    msgDiv.className = 'error mt-1';
                }
            } catch (err) {
                msgDiv.textContent = 'Network error during registration test.';
                msgDiv.className = 'error mt-1';
            }
        });
    </script>
</body>
</html>
