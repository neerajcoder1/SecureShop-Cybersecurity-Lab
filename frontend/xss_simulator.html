<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS DOM Simulator</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .input-group { margin-bottom: 1rem; width: 100%; display: flex; gap: 0.5rem; }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.5rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 4px;
        }
        button {
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #2563eb; }
        .output-box {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            min-height: 50px;
            word-wrap: break-word;
        }
        .success-box {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>DOM XSS Simulator</h2>
        <p>This is a vulnerable search page simulator. Try injecting a payload into the URL fragment (#) or the search box that pops up a JavaScript alert.</p>
        
        <div class="input-group">
            <input type="text" id="search-input" placeholder="Search query...">
            <button onclick="doSearch()">Search</button>
        </div>

        <div>
            <strong>Search Results for:</strong>
            <!-- VULNERABLE: innerHTML allows script execution -->
            <div id="search-results" class="output-box"></div>
        </div>

        <div id="flag-box" class="success-box">
            <strong>Payload Executed!</strong><br>
            Submit this flag in the terminal: <span style="font-family: monospace; font-size: 1.2rem; margin-top: 0.5rem; display: block;">flag{xss_dom_manipulation}</span>
        </div>
    </div>

    <script>
        // Hook window.alert to detect successful XSS
        const originalAlert = window.alert;
        window.alert = function(msg) {
            document.getElementById('flag-box').style.display = 'block';
            originalAlert.call(window, "XSS Executed! Message: " + msg);
        };

        function doSearch() {
            const val = document.getElementById('search-input').value;
            window.location.hash = val;
            processHash();
        }

        function processHash() {
            let query = decodeURIComponent(window.location.hash.substring(1));
            if (query) {
                // VULNERABLE SINK: innerHTML
                document.getElementById('search-results').innerHTML = query;
                
                // Note: Scripts injected via innerHTML don't automatically execute.
                // To trigger DOM XSS here, an img tag with an onerror handler is typically used.
                // e.g. <img src="x" onerror="alert(1)">
            }
        }

        // Run on page load and hash change
        window.addEventListener('hashchange', processHash);
        window.addEventListener('load', processHash);
    </script>
</body>
</html>
