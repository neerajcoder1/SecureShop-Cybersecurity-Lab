<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - User Profile</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <span class="logo-icon">[]</span> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <div class="container layout-sidebar">
        
        <div class="sidebar-nav card">
            <h3 class="mb-1">Account settings</h3>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profile.html" class="active">Profile & Orders</a>
            <a href="#" onclick="logout()">Sign out</a>
        </div>

        <div>
            <h2><span class="logo-icon">#</span> Identity Information</h2>
            <div id="profile-info" class="card mt-1 mb-2 terminal"></div>

            <h2><span class="logo-icon">#</span> Order History & IDOR Testing</h2>
            <p class="text-muted mb-1">Attempt to fetch other users' orders using Burp Suite or the browser tools.</p>
            <div id="orders-list" class="grid gap-1 mt-1"></div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/users/me`);
                if (res && res.ok) {
                    const user = await res.json();
                    const container = document.getElementById('profile-info');
                    
                    container.appendChild(safeCreateElement('div', `ID:       ${user.id}`));
                    container.appendChild(safeCreateElement('div', `USERNAME: ${user.username}`));
                    container.appendChild(safeCreateElement('div', `EMAIL:    ${user.email}`));
                    container.appendChild(safeCreateElement('div', `ROLE:     ${user.role || 'user'}`));
                }
            } catch (e) {
                console.error("Profile load error", e);
            }
        }

        async function loadOrders() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/orders`);
                if (res && res.ok) {
                    const orders = await res.json();
                    const container = document.getElementById('orders-list');
                    
                    if (orders.length === 0) {
                        container.appendChild(safeCreateElement('p', 'No orders found in database.', 'text-muted'));
                        return;
                    }

                    orders.forEach(o => {
                        const div = safeCreateElement('div', null, 'card flex justify-between items-center');
                        
                        const info = safeCreateElement('div');
                        info.appendChild(safeCreateElement('div', `Order ID: ${o.id}`, 'terminal'));
                        info.appendChild(safeCreateElement('div', `Product ID: ${o.product_id} | Qty: ${o.quantity}`, 'text-muted'));
                        
                        const badge = safeCreateElement('span', o.status, 'badge badge-info mt-1');
                        info.appendChild(badge);
                        
                        div.appendChild(info);
                        
                        const verifyBtn = safeCreateElement('button', 'Test IDOR Protection', 'btn btn-outline');
                        verifyBtn.onclick = () => fetchOrderDetails(o.id);
                        div.appendChild(verifyBtn);

                        container.appendChild(div);
                    });
                }
            } catch (e) {
                console.error("Orders load error", e);
            }
        }

        async function fetchOrderDetails(id) {
            try {
                const res = await fetchWithAuth(`${API_BASE}/orders/${id}`);
                if (res.ok) {
                    const data = await res.json();
                    alert(`SUCCESS: Fetched order details for ID ${data.id}.\n\nTry intercepting this request in Burp Suite and changing the ID to an order that doesn't belong to you to test for Broken Access Control.`);
                } else {
                    const data = await res.json();
                    alert(`ACCESS DENIED: ${data.detail}.\n\nIDOR Protection is active and prevented unauthorized access.`);
                }
            } catch (e) {
                alert('Network error during API call.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return;
            }
            loadProfile();
            loadOrders();
        });
    </script>
</body>
</html>
