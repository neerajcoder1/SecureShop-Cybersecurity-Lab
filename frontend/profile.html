<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - User Profile</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" style="margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="8 10 11 13 8 16"></polyline><line x1="13" y1="16" x2="16" y2="16"></line></svg> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <style>
        .hacker-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
            margin-bottom: 2rem;
        }
        .hacker-card::after {
            content: '';
            position: absolute;
            top: 10px; right: 10px;
            width: 50px; height: 50px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="none" stroke="%2358a6ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>') no-repeat center;
            opacity: 0.1;
        }
        .id-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.5rem;
        }
        .id-label { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .id-value { font-family: var(--font-mono); font-weight: 600; color: var(--text-main); }
        .history-item {
            background: #000000;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }
    </style>

    <div class="container layout-sidebar">
        
        <div class="sidebar-nav card">
            <h3 class="mb-1">Account settings</h3>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profile.html" class="active">Profile & History</a>
            <a href="#" onclick="logout()">Sign out</a>
        </div>

        <div>
            <!-- Flat Hacker ID Card -->
            <div class="hacker-card">
                <h2 style="margin-top: 0; color: var(--accent-blue); display: flex; justify-content: space-between;">
                    <span>Operative Identity</span>
                    <span id="user-badge" class="badge badge-info" style="font-size: 0.8rem;">Unranked</span>
                </h2>
                <div id="profile-info" class="mt-2">
                    <!-- Injected via JS -->
                    <p class="text-muted">Decrypting identity matrix...</p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-2">
                <!-- IDOR Testing Area (Real History) -->
                <div class="card">
                    <h3 class="mb-1">Active Operations (Orders)</h3>
                    <p class="text-muted mb-1" style="font-size: 0.85rem;">Live trace of your API payloads and database interactions.</p>
                    <div id="orders-list" class="flex-col gap-1 mt-1">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                // Fallback username if API fails
                let username = 'Learner';
                let email = 'Unknown';
                let id = '001';
                let role = 'user';

                const token = getToken();
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    if (payload.sub) username = payload.sub;
                } catch(e) {}

                try {
                    const res = await fetchWithAuth(`${API_BASE}/users/me`);
                    if (res && res.ok) {
                        const user = await res.json();
                        id = user.id;
                        username = user.username;
                        email = user.email;
                        role = user.role || 'user';
                    }
                } catch(e) {
                    console.log("Using fallback profile data.");
                }

                const container = document.getElementById('profile-info');
                container.innerHTML = `
                    <div class="id-row"><span class="id-label">Operative ID</span><span class="id-value">OP-${String(id).padStart(4, '0')}</span></div>
                    <div class="id-row"><span class="id-label">Handle</span><span class="id-value" style="color: var(--accent-blue);">${username}</span></div>
                    <div class="id-row"><span class="id-label">Comms</span><span class="id-value">${email}</span></div>
                    <div class="id-row" style="border:none;"><span class="id-label">Clearance</span><span class="id-value">${role.toUpperCase()}</span></div>
                `;

                const badge = document.getElementById('user-badge');
                badge.className = 'badge badge-info';
                badge.textContent = `LEVEL ${id}`;

            } catch (e) {
                console.error("Profile load error", e);
            }
        }

        async function loadOrders() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/orders`);
                if (res && res.ok) {
                    const orders = await res.json();
                    const container = document.getElementById('orders-list');
                    
                    if (orders.length === 0) {
                        container.innerHTML = '<div class="terminal text-muted" style="font-size:0.85rem; background: #000000; border: 1px solid #30363d; color: #8b949e;">[+] Database scan complete: No active orders found for this identity.</div>';
                        return;
                    }

                    container.innerHTML = ''; // clear
                    orders.forEach(o => {
                        const div = document.createElement('div');
                        div.className = 'history-item flex justify-between items-center';
                        div.style.borderLeft = '3px solid #d29922'; // accent-orange hardcoded for dark mode
                        
                        div.innerHTML = `
                            <div>
                                <div style="font-size: 0.85rem; color: #d29922; font-family: var(--font-mono);">Order #${o.id}</div>
                                <div style="font-size: 0.8rem; color: #8b949e;">Prod: ${o.product_id} | Qty: ${o.quantity}</div>
                            </div>
                            <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; border-color: #30363d; color: #c9d1d9;" onclick="fetchOrderDetails(${o.id})">Intercept</button>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (e) {
                console.error("Orders load error", e);
            }
        }

        async function fetchOrderDetails(id) {
            try {
                const res = await fetchWithAuth(`${API_BASE}/orders/${id}`);
                if (res.ok) {
                    const data = await res.json();
                    showToast(`[+] SUCCESS: Fetched order details for ID ${data.id}.\n\nTry intercepting this request in Burp Suite and changing the ID to an order that doesn't belong to you to test for Broken Access Control.`, "success");
                } else {
                    const data = await res.json();
                    showToast(`[-] ACCESS DENIED: ${data.detail}.\n\nIDOR Protection is active and prevented unauthorized access.`, "error");
                }
            } catch (e) {
                showToast('[-] Network error during API call.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return;
            }
            loadProfile();
            loadOrders();
        });
    </script>
</body>
</html>
