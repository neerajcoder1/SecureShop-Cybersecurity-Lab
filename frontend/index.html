<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureShop Lab - Practice Web Security</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" style="margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="8 10 11 13 8 16"></polyline><line x1="13" y1="16" x2="16" y2="16"></line></svg> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <div class="hero">
      <div class="container">
        <h1>Practice Web Security. Break Safely. Learn Securely.</h1>
        <p>SecureShop is an open-source cybersecurity testing lab designed for authorized hands-on web application security practice.</p>
        <div class="flex justify-center gap-1 mt-2">
          <a href="/labs.html" class="btn btn-primary">Start Testing</a>
          <a href="/security.html" class="btn btn-outline">Explore Security Controls</a>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="flex justify-between items-center mb-2">
        <h2>Target Environment (Products API)</h2>
        <div class="form-group flex gap-1" style="margin-bottom: 0;">
          <input type="text" id="searchInput" placeholder="Inject search payload..." style="width: 250px;" />
          <button onclick="searchProducts()" class="btn">Test Search</button>
        </div>
      </div>

      <div id="products-list" class="grid grid-cols-3 gap-1 mt-2"></div>
    </div>

    <script>
      async function loadProducts(query = "") {
        const url = query
          ? `${API_BASE}/products/search?q=${encodeURIComponent(query)}`
          : `${API_BASE}/products`;
        try {
          const response = await fetch(url);
          const products = await response.json();
          const container = document.getElementById("products-list");

          container.textContent = "";

          if (products.length === 0) {
            container.appendChild(safeCreateElement("p", "No products returned. Query mitigated.", "text-muted"));
            return;
          }

          products.forEach((p) => {
            const card = safeCreateElement("div", null, "product-card");

            const title = safeCreateElement("h3", p.name);
            title.style.color = "var(--text-heading)";
            card.appendChild(title);
            
            card.appendChild(safeCreateElement("p", p.description, "text-muted"));
            
            const meta = safeCreateElement("div", null, "flex justify-between mt-1");
            meta.appendChild(safeCreateElement("span", `Price: $${p.price.toFixed(2)}`, "terminal"));
            meta.appendChild(safeCreateElement("span", `Stock: ${p.stock}`, "terminal"));
            card.appendChild(meta);

            const buyBtn = safeCreateElement("button", "Buy / Interact", "btn btn-outline mt-1");
            buyBtn.style.width = "100%";
            buyBtn.onclick = () => buyProduct(p.id);
            card.appendChild(buyBtn);

            container.appendChild(card);
          });
        } catch (error) {
          console.error("Error loading products:", error);
        }
      }

      async function searchProducts() {
        const query = document.getElementById("searchInput").value;
        loadProducts(query);
      }

      async function buyProduct(id) {
        if (!getToken()) {
          window.location.href = "/login.html";
          return;
        }
        try {
          const res = await fetchWithAuth(`${API_BASE}/orders`, {
            method: "POST",
            body: JSON.stringify({ product_id: id, quantity: 1 }),
          });
          if (res.ok) {
            alert("Interaction successful. Check your profile to inspect the IDOR/order object.");
          } else {
            const data = await res.json();
            alert(data.detail || "Interaction rejected by security controls.");
          }
        } catch (e) {
          alert("Error placing order");
        }
      }

      document.addEventListener("DOMContentLoaded", () => loadProducts());
    </script>
  </body>
</html>
