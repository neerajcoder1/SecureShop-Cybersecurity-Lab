<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - Training Modules</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" style="margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="8 10 11 13 8 16"></polyline><line x1="13" y1="16" x2="16" y2="16"></line></svg> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <div class="container layout-sidebar">
        <div class="sidebar-nav card">
            <h3 class="mb-1">Categories</h3>
            <a href="#" class="category-link active" onclick="switchCategory(this, 'available'); return false;">All Labs</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'available'); return false;">Web Security</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'API Security'); return false;">API Security</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'Authentication'); return false;">Authentication</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'Authorization'); return false;">Authorization</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'Injection'); return false;">Injection</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'Browser Security'); return false;">Browser Security</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'coming-soon', 'Network Security'); return false;">Network Security</a>
        </div>

        <div id="main-content">
            <!-- Default Content (Available Labs) -->
            <div id="available-labs">
                <div class="flex justify-between items-center mb-2">
                    <h2>Available Security Labs</h2>
                    <div class="form-group" style="margin: 0; width: 250px;">
                        <input type="text" placeholder="Search labs..." class="input-3d">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-1" id="labs-container">
                    <!-- Labs will be loaded here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadLabs() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/labs`);
                const labs = await res.json();
                
                const container = document.getElementById('labs-container');
                container.innerHTML = '';
                
                labs.forEach(lab => {
                    const badgeClass = lab.difficulty === 'Beginner' ? 'badge-beginner' : 
                                      lab.difficulty === 'Intermediate' ? 'badge-intermediate' : 'badge-advanced';
                    
                    const statusClass = lab.status === 'Online' ? 'status-green' : 'status-yellow';
                    
                    const progress = lab.progress_percentage || 0;
                    
                    // Prevent linking if under construction (though Phase 3 labs are Online)
                    const actionBtn = lab.status === 'Online' 
                        ? `<a href="/workspace.html?lab=${lab.id}" class="btn btn-outline" style="display: block; text-align: center;">View Details</a>`
                        : `<a href="#" class="btn btn-outline" style="display: block; text-align: center; opacity: 0.5; pointer-events: none;">Coming Soon</a>`;
                        
                    container.innerHTML += `
                    <div class="card">
                        <div class="flex justify-between items-center mb-1">
                            <span class="badge ${badgeClass}">${lab.difficulty}</span>
                            <span class="status ${statusClass}">${lab.status}</span>
                        </div>
                        <h3 class="mb-1">${lab.name}</h3>
                        <p class="text-muted mb-1" style="font-size: 0.9rem;">${lab.description}</p>
                        <div class="flex justify-between items-center mb-1" style="font-size: 0.85rem;">
                            <span class="terminal text-muted">Category: ${lab.category}</span>
                            <span class="terminal text-muted">Challenges: ${lab.completed_challenges}/${lab.challenges_count}</span>
                        </div>
                        <div class="flex justify-between items-center mb-1" style="font-size: 0.85rem;">
                            <span class="terminal text-muted">XP Available: ${lab.xp_available}</span>
                            <span class="terminal text-muted">Progress: ${progress}%</span>
                        </div>
                        <div class="progress-bar mb-1"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                        ${actionBtn}
                    </div>
                    `;
                });
                
            } catch (error) {
                console.error("Failed to load labs:", error);
            }
        }

        const availableLabsHTML = document.getElementById('available-labs').outerHTML;

        function switchCategory(element, state, categoryName = "") {
            // Update Active Class
            document.querySelectorAll('.category-link').forEach(link => {
                link.classList.remove('active');
            });
            element.classList.add('active');

            // Update Content
            const mainContent = document.getElementById('main-content');
            
            if (state === 'available') {
                mainContent.innerHTML = availableLabsHTML;
                loadLabs(); // Re-fetch when switching back
            } else if (state === 'coming-soon') {
                mainContent.innerHTML = `
                    <div style="text-align: center; padding-top: 4rem;">
                        <div style="font-size: 4rem; color: var(--accent-blue); margin-bottom: 1rem;">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                        <h2 style="font-size: 2rem; margin-bottom: 1rem;">${categoryName} Coming Soon</h2>
                        <p class="text-muted" style="font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem;">
                            The ${categoryName} category is currently under development. SecureShop is an actively expanding platform.
                        </p>
                        <button class="btn btn-primary" onclick="document.querySelector('.category-link').click();">View Available Labs</button>
                    </div>
                `;
            }
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            loadLabs();
        });
    </script>
</body>
</html>
