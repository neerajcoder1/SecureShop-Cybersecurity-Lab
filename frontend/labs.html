<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop Lab - Training Modules</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" style="margin-right: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="8 10 11 13 8 16"></polyline><line x1="13" y1="16" x2="16" y2="16"></line></svg> SecureShop Cybersecurity Lab
      </div>
      <nav id="main-nav"></nav>
    </header>

    <div class="container layout-sidebar">
        <div class="sidebar-nav card">
            <h3 class="mb-1">Categories</h3>
            <a href="#" class="category-link active" onclick="switchCategory(this, 'All Labs'); return false;">All Labs</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Authentication'); return false;">Authentication</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Authorization'); return false;">Authorization</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Injection'); return false;">Injection</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'File Inclusion'); return false;">File Inclusion</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'API Security'); return false;">API Security</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Cryptography'); return false;">Cryptography</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Client-Side'); return false;">Client-Side</a>
            <a href="#" class="category-link" onclick="switchCategory(this, 'Concurrency'); return false;">Concurrency</a>
        </div>

        <div id="main-content">
            <!-- Default Content (Available Labs) -->
            <div id="available-labs">
                <div class="flex justify-between items-center mb-2">
                    <h2>Available Security Labs</h2>
                    <div class="form-group" style="margin: 0; width: 250px;">
                        <input type="text" id="search-labs" placeholder="Search labs..." class="input-3d" onkeyup="searchLabs(this.value)">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-1" id="labs-container">
                    <!-- Labs will be loaded here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let allLabsData = [];
        let currentCategory = 'All Labs';

        async function loadLabs() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/labs`);
                allLabsData = await res.json();
                renderLabs(allLabsData);
            } catch (error) {
                console.error("Failed to load labs:", error);
            }
        }
        
        function renderLabs(labs) {
            const container = document.getElementById('labs-container');
            if(!container) return;
            container.innerHTML = '';
            
            if(labs.length === 0) {
                 container.innerHTML = '<p class="text-muted" style="grid-column: span 2; text-align: center; padding: 2rem;">No labs found in this category.</p>';
                 return;
            }
            
            labs.forEach(lab => {
                const badgeClass = lab.difficulty === 'Beginner' ? 'badge-beginner' : 
                                  lab.difficulty === 'Intermediate' ? 'badge-intermediate' : 'badge-advanced';
                
                const statusClass = lab.status === 'Online' ? 'status-green' : 'status-yellow';
                
                const progress = lab.progress_percentage || 0;
                
                const actionBtn = lab.status === 'Online' 
                    ? `<a href="/workspace.html?lab=${lab.id}" class="btn btn-outline" style="display: block; text-align: center;">View Details</a>`
                    : `<a href="#" class="btn btn-outline" style="display: block; text-align: center; opacity: 0.5; pointer-events: none;">Coming Soon</a>`;
                    
                container.innerHTML += `
                <div class="card">
                    <div class="flex justify-between items-center mb-1">
                        <span class="badge ${badgeClass}">${lab.difficulty}</span>
                        <span class="status ${statusClass}">${lab.status}</span>
                    </div>
                    <h3 class="mb-1">${lab.name}</h3>
                    <p class="text-muted mb-1" style="font-size: 0.9rem;">${lab.description}</p>
                    <div class="flex justify-between items-center mb-1" style="font-size: 0.85rem;">
                        <span class="terminal text-muted">Category: ${lab.category}</span>
                        <span class="terminal text-muted">Challenges: ${lab.completed_challenges}/${lab.challenges_count}</span>
                    </div>
                    <div class="flex justify-between items-center mb-1" style="font-size: 0.85rem;">
                        <span class="terminal text-muted">XP Available: ${lab.xp_available}</span>
                        <span class="terminal text-muted">Progress: ${progress}%</span>
                    </div>
                    <div class="progress-bar" style="margin-bottom: 1rem;">
                        <div class="progress-fill" style="width: ${progress}%; ${progress === 100 ? 'background-color: var(--accent-green); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);' : ''}"></div>
                    </div>
                    ${actionBtn}
                </div>
                `;
            });
        }

        function switchCategory(element, categoryName) {
            // Update Active Class
            document.querySelectorAll('.category-link').forEach(link => {
                link.classList.remove('active');
            });
            element.classList.add('active');
            
            currentCategory = categoryName;
            filterLabs();
        }
        
        function searchLabs(query) {
            filterLabs(query);
        }
        
        function filterLabs(searchQuery = document.getElementById('search-labs').value) {
            let filtered = allLabsData;
            
            if (currentCategory !== 'All Labs') {
                filtered = filtered.filter(lab => lab.category.includes(currentCategory) || currentCategory.includes(lab.category));
            }
            
            if (searchQuery) {
                const lowerQ = searchQuery.toLowerCase();
                filtered = filtered.filter(lab => 
                    lab.name.toLowerCase().includes(lowerQ) || 
                    lab.description.toLowerCase().includes(lowerQ) ||
                    lab.category.toLowerCase().includes(lowerQ)
                );
            }
            
            renderLabs(filtered);
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            loadLabs();
        });
    </script>
</body>
</html>
